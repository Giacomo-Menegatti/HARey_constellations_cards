# =========================================
# HARey default style file
# =========================================

# GRAPHICAL SETTINGS

dpi: 300      # dpi of the images
min_FOV: 20   # minimum field of view in degrees. Small constellations will be zoomed-out to this FOV to show the sky around them

# =========================================
# STAR SIZE function
# =========================================

# The star sizes are computed from the Airy disk model, in which the size of the star is proportional to (lim_mag - mag)^alpha

star_mag:
  limiting_mag: 5.5   # Limiting magnitude: stars fainter than this are not plotted
  limit_size: 0.01    # Size of limiting magnitude stars, to avoid plotting small points which do not look good when printing
  power_law: 1.5      # Power law exponent. 1 is correct for the radius of the Airy disk, 2 for the total brightness contained in the Airy disk. 1.5 is a compromise between the two.

# =========================================
# LINE PLOT SETTINGS
# =========================================  

# LINE TRANSPARENCY
line_alpha:       
  constellations: 1.0     # Highlighted constellations lines
  bkg_constellations: 0.3 # Not-highlighted constellations lines
  shadows: 0.3            # Shadows arond the highlighted constellations lines
  ecliptic: 0.5           # Ecliptic line

# LINE WIDTHS
# The default line width is computed from the marker size (which is the plotted size of a 0-mag star)

line_widths:

  # Line widths shared by every plot

  scale_factor: 0.006     # Scale factor to convert from marker_size to default line_width 
  constellations: 1.0     # Highlighted constellations lines relative width
  bkg_constellations: 1.0 # Not-highlighted constellations lines relative width
  shadows: 2.51           # Shadows arond the highlighted constellations lines relative width
  helpers: 1.0            # Helper lines relative width
  asterisms: 1.25         # Asterism lines relative width
  ecliptic: 1.5           # Ecliptic line relative width
  zodiac:                 # Zodiac ribbon
    thin: 1.0             # Thin lines for minor divisions
    thick: 4.0            # Thick lines for dividing the zodiacal signs
  
  grid:                   # Grid lines, prresent only in equatorial and polar plots
    thick: 0.8            # Celestial equator grid line width
    thin: 0.6             # Generic grid line width

  planisphere:            # Planisphere lines
    borders: 1.0          # Border lines (circle, visible horizon)
    meridians: 0.6        # Planisphere meridian lines
  
# LINE STYLES

line_styles:

  # Linestyles shared by every plot

  constellations: solid       # Highlighted constellations lines
  bkg_constellations: solid   # Not-highlighted constellations lines
  shadows: solid              # Shadows arond the highlighted constellations lines
  helpers: dotted             # Helper lines
  asterisms: solid            # Asterism lines
  ecliptic: dashed            # Ecliptic line

  # Line styles specific to each plot

  planisphere:
    meridians: dotted         # Planisphere meridian lines
    borders: solid            # Planisphere border lines
  sky_view:
    horizon: dashed           # Horizon circle in the sky view
  polar:                      
    grid: dashed              # polar map grid lines
  equatorial:
    grid: dashed              # equatorial map grid lines




# =========================================
# STAR SETTINGS
# =========================================

# To keep a consistent look, the size of stars (and other markers) is scaled proportionally to the area of the plott
# (bigger plots will have bigger stars) and to the area of the sky plotted (smaller zoomed-in areas will have bigger stars).
stars:

  size_factor:            # The initial scale factor depends ont the type of plot. 
    card_plot: 200.0      # Scale factor in a card plot
    asterism_plot: 100.0  # Scale factor for the asterism plot
    equatorial: 10.0      # Scale factor in an equatorial full-sky plot
    polar: 100.0          # Scale factor for the polar map
    sky_view: 100.0       # Scale factor for the sky view

  # Pad size for lines. The pad is the empty area around the star where the constellation lines stop  
  # The pad is computed as star_size * proportional_term + constant_term
  line_pad:
    proportional: 2.0     # proportional term
    constant: 0.01        # constant term

  # Pad properties. The pad is a copy of the star markew with the color of the sky by default, so the star is separated from the background
  
  pad:                    # Pad around the star. It's a copy of the star markew with the color of the sky by default
    size: 1.05            # Relative size of the pad compared to the star
    alpha: 0.8            # Transparency of the pad
    line_w: 0.0           # Relative line width of the pad (compared to the generic line width)


  # Shadow properties. The shadow is plotted above the pad below the star to make it more 3D. It could also be used as a highlight

  shadow: 
    offset_x: 0.001       # Offset factor in the x direction (proportional to the star size)
    offset_y: 0.001       # Offset factor in the y direction
    size: 1.5             # Size of the shadow compared to the star size
    alpha: 1.0            # Transparency of the shadow
    line_w : 0.1          # Relative line width of the shadow (compared to the generic line width)

  # Star markers properties

  alpha_bkg: 0.8          # Transparency of the background stars (those rendered with a dot, below 5.5 mag)
  alpha_faint: 0.8        # Transparency of not-highlighted stars
  alpha_high: 1.0         # Transparency of highlighted stars

# Star colormap, to assign each star a realistic color based on the B-V index
star_colormap: stellarium # Either helland or stellarium

# =========================================
# MILKY WAY SETTINGS
# =========================================

milky_way:
  mw_levels: 5      # Number of luminosity levels in the Milky Way. One will give only the outline, more will give a more realistic look
  alpha_low: 0.15   # Alpha value for the lowest luminosity level
  alpha_high: 0.3   # Alpha value for the highest luminosity level

# =========================================
# ZODIAC RIBBON SETTINGS
# =========================================

zodiac:
  ribbon_width: 1.0          # Width of the zodiac ribbon (scale factor w.r.t the marker size)
  ribbon_alpha : 0.2
  pad_size: 1.2    # Size of the circle markers (scale factor w.r.t the marker size)
  pad_alpha: 0.9
  text_size: 0.8
  thick_spacing: 30
  thin_spacing: 5

# =========================================
# COLOR SETTINGS
# =========================================

# WARNING: These colors will be overwritten by changing them after the style has been loaded

colors:
  sky: '#191970'              # Sky color
  stars: '#ffffff'            # Stars color (if the flag star_colors is set, stars will have realistic colors)
  star_pad: 'none'            # Color of the pad around the stars. If none, the color will bw the same as the sky
  milky_way: '#ffffff'        # Milky way color
  shadow: '#000000'           # Shadow below the . Could be used to make a glow...
  con_lines: '#ffffff'        # Constellation lines
  con_lines_shadow: '#000000' # Shadow below the constellation lines
  asterisms: '#32cd32'        # Asterism lines
  helpers: '#ff7f50'          # Helper lines
  horizon: '#ffffff'          # Horizon circle color
  grid: '#ffff00'             # Grid lines
  ecliptic: '#ff0000'         # Ecliptic line
  zodiac: '#ffa500'           # Zodiac ribbon
  cardinals: '#8b0000'        # Cardinal markers and north indicator
  border: '#ffd700'           # Skyview border color
  mater: '#000000'            # Planisphere mater color
  cardback_1: '#004577'       # Color of the cardback, first type
  cardback_2: '#660000'       # Color of the cardback, second type
  accent_1: '#b8860b'         # Color of the accent on the first cardback
  accent_2: '#b8860b'         # Color of the accent on the second cardback
  calendar: '#000000'


  star_names: '#ffd700'       # Star name labels
  con_names: '#00ffff'        # Constellation name labels
  con_parts: '#ee82ee'        # Constellation part labels
  asterism_labels: '#00ff00'  # Asterism labels
  ecliptic_label: '#ff0000'   # Ecliptic label
  zodiac_label: '#fff000'     # Zodiac label

# =========================================
# PLOT SETTINGS FLAGS
# =========================================        
  
# The flags group several plot options that are shared by many plots and are boolean
# They can be set for one plot (and the following) by calling 'flag' or '-flag' inside of the function

flags:
  con_lines: true             # Constellation lines visibility
  con_names: false            # Constellation names visibility
  con_parts: true             # Constellation part names visibility
  asterisms: false            # Asterism lines visibility
  helpers: false              # Helper lines visibility
  star_names: false           # Star name labels visibility
  grid: false                 # Grid lines visibility
  ecliptic: true             # Ecliptic line visibility
  zodiac: false                # Zodiac ribbon visibility
  milky_way: true             # Milky way visibility  
  harey_stars: true           # Use the custom HARey star markers to show the stars magnitudes or just points
  show: true                  # Show the plots
  save: false                # Save the plots. Plots are saved by default if given a save_name    
  star_colors: true           # Use realistic colors for the stars or all the same color
  show_guides: false          # Show the cards safe plot area. Just for debugging purposes
  radial_labels: true

# =========================================
# FONT SETTINGS
# =========================================

# Note: these fonts have to be present in your system
fonts:
  labels:                 # Font used for labels
    family: DejaVu Sans
    weight: normal
  cardback:               # Font used on the cardbacks
    family: DejaVu Sans
    weight: bold
  calendar:               # Font used on the calendar
    family: DejaVu Sans
    weight: bold

# The font sizes are divided in large (constellation and asterism names) and small (parts and star names)
font_sizes:
  card_plot: 10           # Font size in the card plot, only for small labels
  asterism_plot :         # Font sizes in the asterism plot, both small and large labels
    s : 7
    l: 10
  equatorial_plot:        # Font sizes in the equatorial plot, both small and large labels
    s: 7
    l: 10
  polar_plot:             # Font sizes in the polar map, both small and large labels
    s: 7
    l: 10
  sky_view:               # Font sizes in the sky view, both small and large labels
    s: 7
    l: 10

# =========================================
# SKY VIEW SETTINGS
# =========================================

# The sky view border is the gold area around it where the cardinal markers are located
sky_view:
  border_size: 0.05       # Relative width of the border annulus w.r.t the plot radius
  marker_radius : 0.97    # Relative distance from the center of the cardinal markers (1.0 is the border)
  marker_size : 10        # Cardinal marker size (NOT affected by the generic marker size factor, because they are not part of the sky map)

# =========================================
# CALENDAR AND HOUR SETTINGS FOR THE PLANISPHERE
# =========================================

planisphere:
  hatch : '.....'         # Hatch patter of the planisphere is SOLID_FILL is false






